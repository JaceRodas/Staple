<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
  <script src="dashboard.js"></script>
</head>
<body>
  <header class="header">
    <nav class="navbar at-top">
      <ul>
        <li><a href="../index.html">home</a></li>
        <li><a href="#" id="shopmodal">shop by</a></li>
        <li><a href="../Info/Contact.html">contact us</a></li>
        <li><a href="../Info/About.html">about us</a></li>
      </ul>

      <a href="../index.html" class="logo-link"><img src="../Assets/logo.png" class="logo" alt="Staple Logo" /></a>

      <div class="user-container" id="userButton">
        <img src="../Assets/user.png" class="userlogo" alt="User" />
      </div>

      <div class="question-container" id="questionButton">
        <img src="../Assets/question.png" class="questionlogo" alt="Question" />
      </div>

      <div class="search-container" id="searchButton">
        <img src="../Assets/search.png" class="searchlogo" alt="Search" />
      </div>

      <div class="cart-container" id="cartButton">
        <img src="../Assets/shoppingcart.png" class="cartlogo" alt="Cart" />
        <div class="cart-badge">0</div>
      </div>
    </nav>
  </header>

  <div id="modalContainer" class="modal-container">
    <div class="modal">
      <a href="../Clothes_Sites/Cropped Box/CboxShirt.html">
        <img src="../Assets/Cropped.jfif" alt="Modal 1">
      </a>
    </div>
    <div class="modal">
      <a href="../Clothes_Sites/Regular Fit/RegShirt.html">
        <img src="../Assets/Reg.jfif" alt="Modal 2">
      </a>
    </div>
    <div class="modal">
      <a href="../Clothes_Sites/Oversized/OverShirt.html">
        <img src="../Assets/Over.jfif" alt="Modal 3">
      </a>
    </div>
  </div>

  <main class="dashboard-main">
    <section class="section-card account-overview">
      <div class="section-title-row">
        <h2>Account Overview</h2>
      </div>
      <div class="overview-grid">
        <div class="profile-panel">
          <div class="profile-avatar-wrap">
            <img id="profileAvatar" src="../Assets/user.png" alt="Profile picture" class="profile-avatar">
            <button type="button" id="changeProfileImageBtn" class="subtle-btn">Change Photo</button>
            <input type="file" id="profileImageInput" accept="image/*" hidden>
          </div>
          <div class="profile-meta">
            <h3 id="profileUsername">User</h3>
            <p id="profileEmail">-</p>
          </div>
        </div>

        <div class="stats-panel">
          <h3>Quick Stats</h3>
          <div class="stats-grid">
            <div class="stat-item">
              <span>Total Orders</span>
              <strong id="statTotalOrders">0</strong>
            </div>
            <div class="stat-item">
              <span>Saved Items</span>
              <strong id="statSavedItems">0</strong>
            </div>
          </div>

          <h3>Recent Orders</h3>
          <ul id="recentOrdersList" class="simple-list"></ul>
        </div>
      </div>
    </section>

    <section class="section-card">
      <div class="section-title-row">
        <h2>Orders</h2>
      </div>
      <div id="ordersList" class="rows"></div>
    </section>

    <section class="section-card">
      <div class="section-title-row">
        <h2>Wishlist</h2>
      </div>
      <div id="wishlistList" class="rows"></div>
    </section>

    <section class="section-card">
      <div class="section-title-row">
        <h2>Payment Methods</h2>
        <button type="button" id="addPaymentBtn" class="subtle-btn">Add Payment Method</button>
      </div>
      <div id="paymentsList" class="rows"></div>
      <label class="toggle-line"><input type="checkbox" id="secureCheckoutToggle"> Enable secure checkout settings</label>
    </section>

    <section class="section-card">
      <div class="section-title-row">
        <h2>Addresses</h2>
        <button type="button" id="addAddressBtn" class="subtle-btn">Add Address</button>
      </div>
      <div id="addressesList" class="rows"></div>
    </section>

    <section class="section-card">
      <div class="section-title-row">
        <h2>Website Settings</h2>
      </div>
      <div class="website-settings-grid">
        <label class="toggle-line website-toggle"><input type="checkbox" id="disableTransitionToggle"> Turn off animation (transition)</label>
        <label class="toggle-line website-toggle"><input type="checkbox" id="darkModeToggle"> Dark mode</label>
      </div>
    </section>

    <section class="section-card">
      <div class="section-title-row">
        <h2>Account Settings</h2>
      </div>
      <form id="accountSettingsForm" class="settings-form">
        <label>Update Email
          <input type="email" id="settingsEmail" required>
        </label>
        <label>Phone Number
          <input type="tel" id="settingsPhone" placeholder="09XXXXXXXXX">
        </label>
        <label>Change Password
          <input type="password" id="settingsPassword" placeholder="New password">
        </label>
        <button type="submit" class="primary-btn">Save Settings</button>
        <small id="settingsMessage" class="status-message"></small>
        <button type="button" id="logoutBtn" class="logout-btn">Log out</button>
      </form>
    </section>
  </main>

  <footer class="site-footer" style="position: static; width: 100%; box-sizing: border-box; margin-top: auto; padding: 12px 16px; background: rgba(40, 40, 40, 0.72); color: #ffffff; opacity: 1; backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);">
    <div style="display: flex; justify-content: center; align-items: center; gap: 28px; white-space: nowrap;">
      <span>Contact: 0912 345 6789</span>
      <span>Facebook Page: Staple Clothing</span>
    </div>
  </footer>

  <div id="searchOverlay" class="search-overlay"></div>
  <div id="searchModal" class="search-modal">
    <input type="text" id="searchInput" class="search-input" placeholder="Search..." />
  </div>
</body>
</html>
